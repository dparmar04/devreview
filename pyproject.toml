[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devreview"
version = "0.0.0"
description = "AI code reviewer that backtests itself on your repo's git history"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devreview = "devreview.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit", "pip-audit", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls a real LLM API and costs money; never part of make verify"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
